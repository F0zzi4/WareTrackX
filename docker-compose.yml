services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: waretrack
      POSTGRES_USER: waretrack
      POSTGRES_PASSWORD: waretrack
    ports:
      - "5432:5432"
    volumes:
      - waretrack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waretrack -d waretrack"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ./backend
      dockerfile: src/WareTrack.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ErpDb: Host=postgres;Port=5432;Database=waretrack;Username=waretrack;Password=waretrack
      Jwt__Issuer: WareTrack.Api
      Jwt__Audience: WareTrack.Frontend
      Jwt__SigningKey: local-development-signing-key-for-waretrack-portfolio-demo
      Jwt__ExpirationMinutes: 120
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  waretrack_postgres:
